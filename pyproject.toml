[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetpilot"
version = "0.1.0"
description = "Per-task token budgeting for multi-step LLM agents: up-front budget allocation, cross-step reallocation, confidence-based escalation and early exit, measured as cost per correct decision."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Habib Ur Rehman" }]
dependencies = ["torch", "transformers"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
